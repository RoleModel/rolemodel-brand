name: Export logos to standard

# Keeps the `rolemodel-brand` skill in RoleModel/standard in sync with the
# canonical logo set here. On a push that changes the logos, the brand
# configs that select them, or the export script, this re-runs
# `npm run logos:export` against a checkout of `standard` and opens a pull
# request there with whatever changed.
#
# A PR rather than a direct commit, because standard's contribution rules
# require a branch and PR for skill changes.
#
# Auth: GITHUB_TOKEN cannot reach another repository, and standard is
# private, so this mints a short-lived installation token from the org's
# RMS Version Manager GitHub App — the same pattern mcp_rails and blazer_mcp
# already use. No personal access token is involved, so the job does not
# break when someone's individual access changes.
#
# Setup: the app must be installed on RoleModel/standard with Contents
# (read/write) and Pull requests (read/write). The app id and private key are
# already org-level secrets available to this repo.

on:
  push:
    branches:
      - main
    paths:
      # The exported set is derived from the brand configs, not hand-listed,
      # so a config change can alter the export without any logo file moving.
      - "logos/**"
      - "docs/content/config/brands/*.json"
      - "docs/content/prose/brands/*.md"
      - "scripts/export-logos.mjs"
      - ".github/workflows/export-logos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # Scoped to RoleModel/standard only — the minted token cannot touch any
      # other repo, and it expires when the job ends.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RMS_VERSION_MANAGER_APP_ID }}
          private-key: ${{ secrets.RMS_VERSION_MANAGER_CERT }}
          owner: RoleModel
          repositories: standard

      - name: Check out rolemodel-brand
        uses: actions/checkout@v4
        with:
          path: brand

      - name: Check out standard
        uses: actions/checkout@v4
        with:
          repository: RoleModel/standard
          token: ${{ steps.app-token.outputs.token }}
          path: standard

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Export logos into the skill
        working-directory: brand
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          # SOURCE_REF is stamped into the generated README, so use the short
          # form — a 40-character hash reads as noise in the index.
          SOURCE_REF="${FULL_SHA:0:7}" node scripts/export-logos.mjs \
            --dest "${GITHUB_WORKSPACE}/standard/skills/rolemodel-brand/assets/logos"

      - name: Open a pull request if anything changed
        working-directory: standard
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Logo export is already current in standard — nothing to do."
            exit 0
          fi

          short="${SHORT_SHA:0:7}"
          branch="brand-logos-${short}"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add skills/rolemodel-brand/assets/logos
          git commit -m "chore: sync brand logos from rolemodel-brand@${short}"
          git push --force-with-lease origin "$branch"

          # Reuse an open PR for this branch instead of stacking duplicates.
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "Existing PR updated."
            exit 0
          fi

          gh pr create \
            --title "Sync brand logos from rolemodel-brand@${short}" \
            --body "Generated by \`export-logos\` in [RoleModel/rolemodel-brand](https://github.com/RoleModel/rolemodel-brand/commit/${SHORT_SHA}).

          The files under \`skills/rolemodel-brand/assets/logos/\` are produced by \`npm run logos:export\` from the brand configs in that repo. Do not edit them here — change the mark in \`rolemodel-brand\` and this PR regenerates.

          \`assets/logos/README.md\` is the generated index the skill reads to pick a file." \
            --base main \
            --head "$branch"
