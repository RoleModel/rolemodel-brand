<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://rolemodelsoftware.com/brand" />
    <title>Imagery — Brand Guidelines</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="../assets/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="../assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://framerusercontent.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=Space+Grotesk:wght@300..700&family=Geist+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/index.css?v=512d9cde" />
    <script>
      (() => {
        const de = document.documentElement;
        if (new URLSearchParams(location.search).get("embed") === "1") {
          de.classList.add("is-embedded");
        }
        // Hide the page until its module has built the injected DOM (cleared in
        // page-utils initPage). The timeout is a failsafe so the page still
        // reveals if the module loads slowly or fails to run.
        de.classList.add("is-building");
        setTimeout(() => de.classList.remove("is-building"), 2000);
      })();
    </script>
  </head>

  <body>
    <div id="nav-root"></div>

    <header class="imagery-hero" aria-label="Imagery">
      <div
        class="imagery-hero__mosaic"
        id="hero-mosaic"
        aria-hidden="true"
      ></div>
      <div class="imagery-hero__card">
        <h1 class="imagery-hero__title">
          <span class="imagery-hero__num" id="hero-num">05.</span>
          <span id="hero-title">Imagery</span>
        </h1>
        <p class="imagery-hero__intro" id="hero-intro"></p>
      </div>
    </header>

    <main
      class="page-content page-content--imagery"
      aria-label="Imagery guidelines"
    >
      <section aria-labelledby="treatment-heading">
        <span class="section-label" id="treatment-heading">Treatment</span>
        <div id="treatment-content"></div>
      </section>
    </main>
    <section
      id="subimagery-section"
      aria-labelledby="subimagery-heading"
      hidden
    >
      <div id="subimagery-content"></div>
    </section>

    <script type="module">
      import {
        initPage,
        categoryInfo,
        initReveal,
      } from "../assets/js/modules/page-utils.js";
      import {
        MOSAIC_SPANS,
        IMAGERY_TREATMENTS,
      } from "../assets/js/modules/site-content.js";
      import "../assets/js/components/halftone-image.js";

      const { brand, pageData } = initPage("imagery");
      const { category: cat, numLabel } = categoryInfo("imagery", "05");

      document.title = `Imagery — ${brand.name || "Brand Guidelines"}`;
      document.querySelector("#hero-num").textContent = `${numLabel}.`;
      document.querySelector("#hero-title").textContent = cat.name || "Imagery";
      document.querySelector("#hero-intro").textContent = pageData.imageryIntro;

      const images = pageData.imagery || [];

      // ---- Hero mosaic — irregular full-bleed grid behind the title card ----
      // Span pattern fills the 6×2 desktop grid exactly (2+2+2+1+2+1+2 = 12 cells).
      document.querySelector("#hero-mosaic").setHTMLUnsafe(
        MOSAIC_SPANS.map((k, i) => {
          const img = images[i % images.length];
          return img
            ? /* html */ `
    <div class="imagery-hero__tile imagery-hero__tile--${k}">
      <img class="imagery-hero__img" src="${img.src}" alt="" loading="eager" decoding="async"/>
    </div>
  `
            : "";
        }).join("")
      );

      // ---- Treatment ----
      document.querySelector("#treatment-content").setHTMLUnsafe(/* html */ `
  <div class="spec-card reveal">
    <div class="spec-card__grid">
      ${IMAGERY_TREATMENTS.map(
        (t) => /* html */ `
        <div class="${t.span === "full" ? "spec-card__item--full" : ""}">
          <span class="spec-card__label">${t.label}</span>
          <p class="spec-card__text">${t.text}</p>
        </div>
      `
      ).join("")}
    </div>
  </div>
`);

      // ---- Product family imagery — only brands that define it ----
      // A sub-brand has no page of its own (it isn't in brand-order), so its
      // photography lives in a section beneath the parent brand's, the same
      // shape the logo and color pages use for sub-brand content.
      const subBrandImagery = pageData.subBrandImagery || [];
      if (subBrandImagery.length) {
        document.querySelector("#subimagery-section").hidden = false;
        document.querySelector("#subimagery-content").setHTMLUnsafe(
          subBrandImagery
            .map(
              (sub) => /* html */ `
    <div class="subimagery reveal">
      <div class="subimagery__intro">
        <span class="section-label" id="subimagery-heading">Product Family</span>
        <h2 class="subimagery__name">${sub.name}</h2>
        <p class="subimagery__text">${sub.text}</p>
        <a class="download-button download-button--accent" href="../tools/halftone/" target="_top">
          Generate Standard images →
        </a>
      </div>
        
      <div class="subimagery__grid">
        ${sub.images
          .map(
            (img) => /* html */ `
          <halftone-image class="subimagery__tile" src="${img.src}"></halftone-image>
        `
          )
          .join("")}
      </div>
    </div>
  `
            )
            .join("")
        );
      }

      initReveal();
    </script>
  </body>
</html>
